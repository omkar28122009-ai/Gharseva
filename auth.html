    <style>
        /* --- DESIGN SYSTEM TOKENS --- */
        :root {
            --brand-primary: #6366f1;       
            --brand-success: #10b981;
            --brand-danger: #ef4444;
            --brand-glow-gold: #fbbf24;     
            --brand-glow-orange: #f97316;   
            --bg-main: #030712;             
            --bg-card: rgba(17, 24, 39, 0.75); 
            --border-color: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 10px 35px 0 rgba(0, 0, 0, 0.45);
            --text-muted: #94a3b8;
            --font-stack: 'Plus Jakarta Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-stack); -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-main); color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; overflow-y: auto; padding: 40px 0; opacity: 0; transition: opacity 0.4s ease-in-out; }
        body.page-loaded { opacity: 1; }

        /* --- AMBIENT GLOW --- */
        .glow-orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.15; pointer-events: none; z-index: 1; }
        .orb-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: var(--brand-primary); }
        .orb-2 { bottom: -10%; right: -10%; width: 350px; height: 350px; background: var(--brand-glow-orange); }

        /* --- AUTH CONTAINER --- */
        .auth-wrapper { position: relative; z-index: 10; width: 100%; max-width: 440px; padding: 20px; }
        .brand-logo { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 1.8rem; font-weight: 800; margin-bottom: 30px; letter-spacing: -0.03em; background: linear-gradient(135deg, #fff 30%, var(--brand-glow-gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .glass-card { background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border-color); box-shadow: var(--card-shadow); border-radius: 20px; padding: 32px 24px; }

        /* --- TABS --- */
        .auth-tabs { display: flex; gap: 8px; margin-bottom: 24px; background: rgba(15, 23, 42, 0.6); padding: 6px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .tab-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; background: transparent; color: var(--text-muted); font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; }
        .tab-btn.active { background: rgba(99, 102, 241, 0.15); color: #fff; border: 1px solid rgba(99, 102, 241, 0.3); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2); }

        /* --- FORMS --- */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 800; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; transition: color 0.3s; pointer-events: none; }
        .form-control { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 14px 14px 14px 44px; color: #ffffff; font-size: 0.9rem; outline: none; transition: all 0.3s; }
        .form-control:focus { border-color: var(--brand-primary); box-shadow: 0 0 15px rgba(99, 102, 241, 0.15); }
        .form-control:focus + i, .form-control:not(:placeholder-shown) + i { color: var(--brand-primary); }
        
        select.form-control { appearance: none; -webkit-appearance: none; cursor: pointer; }
        select.form-control option { background-color: #111827; color: #ffffff; }

        /* --- ROLE SELECTOR --- */
        .radio-group { display: flex; gap: 10px; }
        .radio-group input[type="radio"] { display: none; }
        .radio-group label { flex: 1; text-align: center; padding: 12px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; font-weight: 700; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .radio-group input[type="radio"]:checked + label { background: rgba(99, 102, 241, 0.15); color: #fff; border-color: var(--brand-primary); }

        /* --- PARTNER DYNAMIC SECTION --- */
        .partner-section-wrapper { display: none; animation: fadeIn 0.4s ease forwards; margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 20px; }

        .btn-submit { width: 100%; padding: 16px; font-size: 0.95rem; font-weight: 800; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--brand-primary) 0%, #4f46e5 100%); color: #ffffff; cursor: pointer; box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3); transition: all 0.2s; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99, 102, 241, 0.45); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        .auth-view { display: none; animation: fadeIn 0.4s ease forwards; }
        .auth-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- TOASTS --- */
        .toast-container { position: fixed; top: 24px; right: 24px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
        .toast-popup { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border: 1px solid var(--border-color); padding: 14px 24px; border-radius: 12px; color: #fff; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 10px; box-shadow: var(--card-shadow); transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast-popup.active { transform: translateX(0); }
    </style>
</head>
<body>

    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="auth-wrapper">
        <div class="brand-logo">
            <i class="fas fa-shield-halved" style="color: var(--brand-primary);"></i>
            <span>GharSeva</span>
        </div>

        <div class="glass-card">
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <form id="loginForm" class="auth-view active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
                        <i class="fas fa-lock"></i>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="btnLogin">
                    <span>Access Portal</span> <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <form id="signupForm" class="auth-view" onsubmit="handleSignup(event)">
                
                <div class="form-group">
                    <label>Account Type</label>
                    <div class="radio-group">
                        <input type="radio" id="roleCustomer" name="signupRole" value="customer" checked>
                        <label for="roleCustomer"><i class="fas fa-user"></i> Customer</label>
                        
                        <input type="radio" id="rolePartner" name="signupRole" value="partner">
                        <label for="rolePartner"><i class="fas fa-briefcase"></i> Partner</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="signupName" class="form-control" placeholder="John Doe" required>
                        <i class="fas fa-id-card"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="signupEmail" class="form-control" placeholder="Enter your email" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="signupPassword" class="form-control" placeholder="Create a secure password" minlength="6" required>
                        <i class="fas fa-lock"></i>
                    </div>
                </div>

                <div id="partnerSection" class="partner-section-wrapper">
                    <div class="form-group">
                        <label>Service Specialization</label>
                        <div class="input-wrapper">
                            <select id="partnerCategory" class="form-control">
                                <option value="" disabled selected>Select primary skill bracket</option>
                                <option value="electrical">Electrical Systems & Diagnostics</option>
                                <option value="plumbing">Plumbing & Hydronic Engineering</option>
                                <option value="cleaning">Sanitization & Deep Cleaning</option>
                                <option value="appliances">HVAC & Appliance Maintenance</option>
                                <option value="carpentry">Carpentry & Structural Woodwork</option>
                            </select>
                            <i class="fas fa-tools"></i>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Years of Service Experience</label>
                        <div class="input-wrapper">
                            <input type="number" id="partnerExperience" class="form-control" placeholder="e.g., 5" min="0" max="50">
                            <i class="fas fa-business-time"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Business License / Indian PAN Card Number</label>
                        <div class="input-wrapper">
                            <input type="text" id="partnerVerificationId" class="form-control" placeholder="ABCDE1234F" style="text-transform: uppercase;">
                            <i class="fas fa-certificate"></i>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSignup">
                    <span>Create Account</span> <i class="fas fa-user-plus"></i>
                </button>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBfmm4RSOckkFvAFMWrTPuF38koEz2kAkE",
            authDomain: "yukti-247.firebaseapp.com",
            databaseURL: "https://yukti-247-default-rtdb.firebaseio.com",
            projectId: "yukti-247",
            storageBucket: "yukti-247.firebasestorage.app",
            messagingSenderId: "244123454826",
            appId: "1:244123454826:web:56b4d88c3628bb06cfa913",
            measurementId: "G-6BGFCBKTD7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Dynamic Field Toggle Setup
        const partnerSection = document.getElementById('partnerSection');
        const partnerCategory = document.getElementById('partnerCategory');
        const partnerExperience = document.getElementById('partnerExperience');
        const partnerVerificationId = document.getElementById('partnerVerificationId');

        function evaluateRoleFields() {
            const selectedRole = document.querySelector('input[name="signupRole"]:checked').value;
            if (selectedRole === 'partner') {
                partnerSection.style.display = 'block';
                partnerCategory.required = true;
                partnerExperience.required = true;
                partnerVerificationId.required = true;
            } else {
                partnerSection.style.display = 'none';
                partnerCategory.required = false;
                partnerExperience.required = false;
                partnerVerificationId.required = false;
            }
        }

        document.querySelectorAll('input[name="signupRole"]').forEach(radio => {
            radio.addEventListener('change', evaluateRoleFields);
        });

        // UI View Switcher
        window.switchTab = function(view) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.auth-view').forEach(form => form.classList.remove('active'));

            if (view === 'login') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('signupForm').classList.add('active');
                evaluateRoleFields();
            }
        };

        // LOGIN HANDLER
        window.handleLogin = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Authenticating...`;

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const userDoc = await getDoc(doc(db, "users", user.uid));
                
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    const userRole = userData.role || 'customer';
                    
                    showToast(`Access Granted. Welcome, ${userData.fullName}!`, true);

                    setTimeout(() => {
                        if (userRole === 'admin') {
                            window.location.href = 'admin.html';
                        } else if (userRole === 'partner') {
                            window.location.href = 'partner-dashboard.html';
                        } else {
                            window.location.href = 'services.html';
                        }
                    }, 1500);

                } else {
                    showToast("User profile not found in database.", false);
                    btn.disabled = false;
                    btn.innerHTML = `<span>Access Portal</span> <i class="fas fa-arrow-right"></i>`;
                }

            } catch (error) {
                console.error("Login Error:", error);
                showToast(getAuthErrorMessage(error.code), false);
                btn.disabled = false;
                btn.innerHTML = `<span>Access Portal</span> <i class="fas fa-arrow-right"></i>`;
            }
        };

        // SIGNUP HANDLER
        window.handleSignup = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSignup');
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Provisioning...`;

            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const selectedRole = document.querySelector('input[name="signupRole"]:checked').value;

            try {
                // 1. Authenticate & Create User account
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Base Document Data payload
                let userProfilePayload = {
                    fullName: name,
                    email: email,
                    role: selectedRole,
                    createdAt: new Date().toISOString()
                };

                // 3. Inject Structural Experience Metrics if registering as Partner
                if (selectedRole === 'partner') {
                    userProfilePayload.partnerProfile = {
                        specializationCategory: partnerCategory.value,
                        experienceYears: parseInt(partnerExperience.value, 10),
                        verificationIdNumber: partnerVerificationId.value.trim().toUpperCase(),
                        verificationStatus: "PENDING_REVIEW",
                        workAssignmentQueueId: `PARTNER_${partnerCategory.value.toUpperCase()}_${Date.now().toString().slice(-4)}`
                    };
                }

                // 4. Provision records to firestore collection
                await setDoc(doc(db, "users", user.uid), userProfilePayload);

                showToast(`Account created as ${selectedRole.toUpperCase()}. Redirecting...`, true);
                
                setTimeout(() => {
                    if (selectedRole === 'partner') {
                        window.location.href = 'partner-dashboard.html';
                    } else {
                        window.location.href = 'services.html';
                    }
                }, 1500);

            } catch (error) {
                console.error("Signup Error:", error);
                showToast(getAuthErrorMessage(error.code), false);
                btn.disabled = false;
                btn.innerHTML = `<span>Create Account</span> <i class="fas fa-user-plus"></i>`;
            }
        };

        function getAuthErrorMessage(code) {
            switch(code) {
                case 'auth/user-not-found': return 'Identity not found in matrix.';
                case 'auth/wrong-password': return 'Invalid security credentials.';
                case 'auth/email-already-in-use': return 'Email already active on network.';
                case 'auth/weak-password': return 'Password lacks required entropy.';
                case 'auth/invalid-credential': return 'Invalid login credentials.';
                default: return 'Network authorization failure.';
            }
        }

        function showToast(message, isSuccess = true) {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast-popup';
            
            const icon = isSuccess ? 'fa-check-circle' : 'fa-triangle-exclamation';
            const color = isSuccess ? 'var(--brand-success)' : 'var(--brand-danger)';
            
            toast.innerHTML = `<i class="fas ${icon}" style="color:${color}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('active'), 50);
            setTimeout(() => {
                toast.classList.remove('active');
                setTimeout(() => container.removeChild(toast), 300);
            }, 3500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => document.body.classList.add('page-loaded'), 100);
            evaluateRoleFields();
        });
    </script>
</body>
</html>
